# PR validation for a Salesforce DX repo: delta check-only deploy against the
# target org, Code Analyzer on changed files, optional scratch-org validation,
# sticky PR comment, audit artifact (sf-validate-<run_number>).
name: PR Validate
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  validate:
    uses: Gforce-Innovation-Kft/shared-github-actions/.github/workflows/sf-validate.yml@v1
    with:
      scratch-org-validation: true
    secrets:
      sfdx-auth-url: ${{ secrets.DEVHUB_AUTH_URL }}
