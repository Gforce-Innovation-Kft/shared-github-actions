# Gated deploy on merge to main: the `production` GitHub Environment holds the
# required-reviewer gate; after approval the PR-validated deploy request is
# quick-deployed (fallback: delta deploy, then full deploy). Every run records
# a GitHub Deployment and uploads the audit artifact (sf-deploy-<env>-<run>).
#
# Bootstrap a fresh org with: gh workflow run deploy.yml -f full-deploy=true
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full-deploy:
        description: 'Deploy every package directory (bootstrap / re-baseline)'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  production:
    uses: Gforce-Innovation-Kft/shared-github-actions/.github/workflows/sf-deploy.yml@v1
    with:
      environment: production
      full-deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.full-deploy }}
    secrets:
      sfdx-auth-url: ${{ secrets.DEVHUB_AUTH_URL }}
