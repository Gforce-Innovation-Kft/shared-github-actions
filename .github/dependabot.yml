# Keeps third-party actions and npm dependencies up to date.
#
# Actions are pinned to the floating major tag (actions/checkout@v7), so Dependabot
# only opens a PR when a new MAJOR is published — patch and minor releases arrive on
# their own. That is the intended trade-off: far fewer dependency PRs, at the cost of
# trusting each publisher not to force-move a tag. See CLAUDE.md, Authoring Conventions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite action manifests need their
    # directories listed explicitly.
    directories:
      - "/"
      - "/.github/actions/aws-secret-get"
      - "/.github/actions/sf-org-login"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
