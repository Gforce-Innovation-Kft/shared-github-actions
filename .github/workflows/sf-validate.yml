name: Salesforce Validate (Reusable)

on:
  workflow_call:
    secrets:
      sfdx-auth-url:
        description: 'SFDX auth URL of the validation target org (also the Dev Hub for scratch-org validation)'
        required: true
    inputs:
      container-image:
        description: 'Docker image the Salesforce jobs run in'
        required: false
        default: 'gforceinnovation/sf-ci:latest'
        type: string
      test-level:
        description: 'Apex test level for the check-only deploy (NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg)'
        required: false
        default: 'RunLocalTests'
        type: string
      test-classes:
        description: 'Comma-separated test classes (used with RunSpecifiedTests)'
        required: false
        default: ''
        type: string
      source-dir:
        description: 'Salesforce source directory (delta scan + analyzer workspace)'
        required: false
        default: 'force-app'
        type: string
      from-ref:
        description: 'Delta base ref (defaults to the PR base SHA)'
        required: false
        default: ''
        type: string
      to-ref:
        description: 'Delta head ref (defaults to the checked-out commit)'
        required: false
        default: ''
        type: string
      checkout-submodules:
        description: 'Passed to actions/checkout submodules (false, true, recursive)'
        required: false
        default: 'recursive'
        type: string
      org-alias:
        description: 'Alias used for the validation target org'
        required: false
        default: 'validation'
        type: string
      retention-days:
        description: 'Retention for the validation audit artifact'
        required: false
        default: 90
        type: number
      scratch-org-validation:
        description: 'Also create a scratch org, push source and run tests'
        required: false
        default: false
        type: boolean
      scratch-def-path:
        description: 'Scratch org definition file (used with scratch-org-validation)'
        required: false
        default: 'config/scratch-orgs/ci.json'
        type: string
      fail-on-sev1-violations:
        description: 'Fail on Code Analyzer severity 1 violations'
        required: false
        default: true
        type: boolean
      fail-on-sev2-violations:
        description: 'Fail on Code Analyzer severity 2 violations'
        required: false
        default: true
        type: boolean
      max-violations:
        description: 'Maximum analyzer violations allowed (0 = unlimited)'
        required: false
        default: 0
        type: number
    outputs:
      has-changes:
        description: 'true when the delta contains deployable components'
        value: ${{ jobs.validate.outputs.has-changes }}
      component-count:
        description: 'Number of components in the delta package'
        value: ${{ jobs.validate.outputs.component-count }}
      deploy-request-id:
        description: 'Salesforce deploy request id of the check-only validation (quick-deploy handle)'
        value: ${{ jobs.validate.outputs.deploy-request-id }}
      artifact-name:
        description: 'Name of the uploaded validation audit artifact'
        value: ${{ jobs.validate.outputs.artifact-name }}
      num-violations:
        description: 'Total Code Analyzer violations'
        value: ${{ jobs.analyze.outputs.num-violations }}
      num-sev1-violations:
        description: 'Code Analyzer severity 1 violations'
        value: ${{ jobs.analyze.outputs.num-sev1-violations }}
      num-sev2-violations:
        description: 'Code Analyzer severity 2 violations'
        value: ${{ jobs.analyze.outputs.num-sev2-violations }}

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
    permissions:
      contents: read
    outputs:
      has-changes: ${{ steps.delta.outputs.has-changes }}
      component-count: ${{ steps.delta.outputs.component-count }}
      deploy-request-id: ${{ steps.check-deploy.outputs.deploy-request-id }}
      artifact-name: sf-validate-${{ github.run_number }}
    steps:
      - name: Check out files
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          submodules: ${{ inputs.checkout-submodules }}

      - name: Resolve delta refs
        id: refs
        shell: bash
        env:
          INPUT_FROM_REF: ${{ inputs.from-ref }}
          INPUT_TO_REF: ${{ inputs.to-ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          FROM_REF="${INPUT_FROM_REF:-$PR_BASE_SHA}"
          TO_REF="${INPUT_TO_REF:-HEAD}"
          HEAD_SHA="${PR_HEAD_SHA:-$FALLBACK_SHA}"

          if [ -z "$FROM_REF" ]; then
            echo "::error::from-ref is empty and this is not a pull_request event — pass from-ref explicitly." >&2
            exit 1
          fi

          {
            echo "from-ref=$FROM_REF"
            echo "to-ref=$TO_REF"
            echo "head-sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"

      # Own-repo absolute ref: actions inside a reusable workflow resolve against the
      # caller's checkout, so a relative path would not exist there. Kept on @main —
      # same version-skew caveat as sf-jwt-login -> get-aws-secret.
      - name: Generate delta package
        id: delta
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-delta-package@main
        with:
          from-ref: ${{ steps.refs.outputs.from-ref }}
          to-ref: ${{ steps.refs.outputs.to-ref }}
          source-dir: ${{ inputs.source-dir }}

      - name: Salesforce login
        id: login
        if: steps.delta.outputs.has-changes == 'true'
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@main
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: ${{ inputs.org-alias }}

      - name: Check-only deploy of the delta
        id: check-deploy
        if: steps.delta.outputs.has-changes == 'true'
        shell: bash
        env:
          PACKAGE_PATH: ${{ steps.delta.outputs.package-path }}
          ORG_ALIAS: ${{ inputs.org-alias }}
          TEST_LEVEL: ${{ inputs.test-level }}
          TEST_CLASSES: ${{ inputs.test-classes }}
        run: |
          set -euo pipefail

          ARGS=(--manifest "$PACKAGE_PATH" --target-org "$ORG_ALIAS" --test-level "$TEST_LEVEL" --json --wait 60)
          if [ "$TEST_LEVEL" = "RunSpecifiedTests" ] && [ -n "$TEST_CLASSES" ]; then
            IFS=',' read -ra CLASSES <<< "$TEST_CLASSES"
            for CLASS in "${CLASSES[@]}"; do
              ARGS+=(--tests "$CLASS")
            done
          fi

          set +e
          sf project deploy validate "${ARGS[@]}" > validate-result.json
          EXIT_CODE=$?
          set -e

          DEPLOY_ID=$(node -pe "const r = JSON.parse(require('fs').readFileSync('validate-result.json','utf8')); (r.result && r.result.id) || ''")
          echo "deploy-request-id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

          node -e "
            const r = JSON.parse(require('fs').readFileSync('validate-result.json','utf8')).result || {};
            console.log('Status: ' + (r.status || 'unknown'));
            console.log('Components: ' + (r.numberComponentsDeployed || 0) + '/' + (r.numberComponentsTotal || 0));
            console.log('Tests: ' + (r.numberTestsCompleted || 0) + ' completed, ' + (r.numberTestErrors || 0) + ' errors');
            const failures = ((r.details || {}).componentFailures) || [];
            for (const f of [].concat(failures)) console.log('❌ ' + f.fullName + ': ' + f.problem);
          "

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Check-only validation failed (deploy request $DEPLOY_ID)" >&2
            exit "$EXIT_CODE"
          fi
          echo "✅ Check-only validation succeeded (deploy request $DEPLOY_ID)"

      - name: Write validation record
        if: always() && steps.check-deploy.outputs.deploy-request-id != ''
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.check-deploy.outputs.deploy-request-id }}
          ORG_ID: ${{ steps.login.outputs.org-id }}
          ORG_USERNAME: ${{ steps.login.outputs.username }}
          HEAD_SHA: ${{ steps.refs.outputs.head-sha }}
          BASE_SHA: ${{ steps.refs.outputs.from-ref }}
          COMPONENT_COUNT: ${{ steps.delta.outputs.component-count }}
          TEST_LEVEL: ${{ inputs.test-level }}
        run: |
          set -euo pipefail
          # validation.json is the quick-deploy handoff consumed by sf-deploy.yml
          node -e "
            require('fs').writeFileSync('validation.json', JSON.stringify({
              deployId: process.env.DEPLOY_ID,
              orgId: process.env.ORG_ID,
              username: process.env.ORG_USERNAME,
              headSha: process.env.HEAD_SHA,
              baseSha: process.env.BASE_SHA,
              componentCount: Number(process.env.COMPONENT_COUNT),
              testLevel: process.env.TEST_LEVEL,
              validatedAt: new Date().toISOString(),
            }, null, 2));
          "

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sf-validate-${{ github.run_number }}
          path: |
            delta
            validate-result.json
            validation.json
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: warn

  analyze:
    if: github.event_name == 'pull_request'
    # Same-repo relative ref: resolves to this repository at the same commit as
    # this workflow, even when sf-validate itself is called cross-repo.
    uses: ./.github/workflows/salesforce-code-analyzer.yml
    permissions:
      pull-requests: write
      contents: read
      actions: read
    with:
      workspace: ${{ inputs.source-dir }}
      fail-on-changed-files-only: true
      fail-on-sev1-violations: ${{ inputs.fail-on-sev1-violations }}
      fail-on-sev2-violations: ${{ inputs.fail-on-sev2-violations }}
      max-violations: ${{ inputs.max-violations }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  scratch-org:
    if: inputs.scratch-org-validation
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
    permissions:
      contents: read
    steps:
      - name: Check out files
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Salesforce Dev Hub login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@main
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: devhub
          set-default-dev-hub: 'true'

      - name: Create scratch org
        shell: bash
        env:
          SCRATCH_DEF: ${{ inputs.scratch-def-path }}
        run: |
          set -euo pipefail
          sf org create scratch \
            --definition-file "$SCRATCH_DEF" \
            --alias ci-scratch \
            --duration-days 1 \
            --set-default \
            --wait 30

      - name: Push source
        shell: bash
        run: |
          set -euo pipefail
          sf project deploy start --target-org ci-scratch --wait 60

      - name: Assign permission sets
        shell: bash
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for PS_FILE in "$SOURCE_DIR"/**/permissionsets/*.permissionset-meta.xml; do
            PS_NAME=$(basename "$PS_FILE" .permissionset-meta.xml)
            sf org assign permset --name "$PS_NAME" --target-org ci-scratch \
              || echo "::warning::Could not assign permission set $PS_NAME"
          done

      - name: Run Apex tests
        shell: bash
        run: |
          set -euo pipefail
          sf apex run test \
            --target-org ci-scratch \
            --test-level RunLocalTests \
            --wait 30 \
            --result-format human \
            --code-coverage

      - name: Delete scratch org
        if: always()
        shell: bash
        run: |
          sf org delete scratch --target-org ci-scratch --no-prompt || true

  pr-comment:
    needs: [validate, analyze, scratch-org]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download validation artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sf-validate-${{ github.run_number }}
          path: validated

      - name: Post PR comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          SCRATCH_RESULT: ${{ needs.scratch-org.result }}
          HAS_CHANGES: ${{ needs.validate.outputs.has-changes }}
          COMPONENT_COUNT: ${{ needs.validate.outputs.component-count }}
          DEPLOY_REQUEST_ID: ${{ needs.validate.outputs.deploy-request-id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact-name }}
          NUM_VIOLATIONS: ${{ needs.analyze.outputs.num-violations }}
          NUM_SEV1: ${{ needs.analyze.outputs.num-sev1-violations }}
          NUM_SEV2: ${{ needs.analyze.outputs.num-sev2-violations }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- sf-validate -->';
            const icon = (result) =>
              ({ success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️' }[result] || '❔');

            let components = '';
            try {
              components = fs.readFileSync('validated/delta/components.md', 'utf8');
              const lines = components.split('\n');
              if (lines.length > 60) {
                components = lines.slice(0, 60).join('\n') + `\n\n_…truncated (${lines.length - 60} more lines in the run summary)._`;
              }
            } catch {
              components = '_Delta component list unavailable._';
            }

            const env = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Salesforce validation',
              '',
              '| Check | Result |',
              '|-------|--------|',
              `| Check-only delta deploy (\`${env.DEPLOY_REQUEST_ID || 'n/a'}\`) | ${icon(env.VALIDATE_RESULT)} ${env.VALIDATE_RESULT} |`,
              `| Code Analyzer (${env.NUM_VIOLATIONS || 0} violations, sev1: ${env.NUM_SEV1 || 0}, sev2: ${env.NUM_SEV2 || 0}) | ${icon(env.ANALYZE_RESULT)} ${env.ANALYZE_RESULT} |`,
              `| Scratch org validation | ${icon(env.SCRATCH_RESULT)} ${env.SCRATCH_RESULT} |`,
              '',
              env.HAS_CHANGES === 'true'
                ? `**${env.COMPONENT_COUNT} component(s) in delta** — audit artifact: \`${env.ARTIFACT_NAME}\``
                : '**No deployable metadata changes in this PR.**',
              '',
              components,
              '',
              `[Workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
