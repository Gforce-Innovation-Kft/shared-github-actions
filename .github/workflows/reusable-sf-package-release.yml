# Salesforce 2GP package release (reusable)
#
# validate -> package -> release. Exactly ONE scratch org, used by `validate`;
# `package` needs only the Dev Hub and `release` needs no Salesforce at all.
#
# Job order is driven by cost. Scratch orgs are capped per Dev Hub (both
# concurrently and per day) and validated package creates are capped at 6/day,
# so validation runs first: a tree that does not compile costs zero creates.
#
# Callers own the cleanup contract for the scratch org — see sf-org-scratch-create.

name: Salesforce Package Release (Reusable)

on:
  workflow_call:
    inputs:
      package:
        description: "Package name or alias from sfdx-project.json. Defaults to the single or default: true entry."
        required: false
        default: ""
        type: string
      container-image:
        description: "Docker image the Salesforce jobs run in"
        required: false
        default: "gforceinnovation/sf-ci:latest"
        type: string
      container-user:
        description: >-
          User the container job runs as. Pass "1001" — the GitHub-hosted
          runner's UID — to run unprivileged: the runner owns /github/home and
          the file-command dir, so the job must be that UID to write them.

          The default is still "root" ONLY because the published
          gforceinnovation/sf-ci:latest predates the change that registers UID
          1001 in /etc/passwd, and `sf` crashes on a UID it cannot resolve.
          Once sf-docker-images v3.0.0 is released, flip this default to "1001"
          — that is the whole point of the input.
        required: false
        default: "root"
        type: string
      checkout-submodules:
        description: "Passed to actions/checkout submodules (false, true, recursive)"
        required: false
        default: "recursive"
        type: string
      scratch-org-definition:
        description: "Scratch org definition file used by the validate job"
        required: false
        default: "config/project-scratch-def.json"
        type: string
      source-dirs:
        description: >-
          Space-separated package directories to deploy during validation. Empty
          deploys every packageDirectories entry, which fails if an unrelated
          entry needs a `replacements` env var. Include the package under
          release AND its dependency directories.
        required: false
        default: ""
        type: string
      run-validate:
        description: "Run the scratch-org validation job. Set false to skip it when scratch org capacity is exhausted."
        required: false
        default: true
        type: boolean
      test-level:
        description: "Apex test level for the validate job (NoTestRun, RunLocalTests, RunAllTestsInOrg)"
        required: false
        default: "RunLocalTests"
        type: string
      code-coverage:
        description: "Calculate code coverage during the package build. Set false for packages with no Apex tests."
        required: false
        default: false
        type: boolean
      skip-validation:
        description: "Build with --skip-validation, drawing on the 500/day limit instead of the 6/day one."
        required: false
        default: false
        type: boolean
      wait-minutes:
        description: "Hard ceiling on how long to wait for the package build"
        required: false
        default: "60"
        type: string
      create-github-release:
        description: "Cut a GitHub Release on the provenance tag"
        required: false
        default: true
        type: boolean
      retention-days:
        description: "Artifact retention"
        required: false
        default: 90
        type: number
    secrets:
      sfdx-auth-url:
        description: "SFDX auth URL of the Dev Hub"
        required: true
      scratch-org-auth-url:
        description: >-
          SFDX auth URL of an EXISTING scratch org to validate in. When set,
          `validate` logs into that org instead of creating one, and does not
          delete it afterwards. Intended for debugging the release flow without
          spending a scratch org per iteration — Dev Hub caps both concurrent
          and daily creates. Leave empty for normal runs.
        required: false
    outputs:
      version-id:
        description: "SubscriberPackageVersionId (04t) — the id you install"
        value: ${{ jobs.package.outputs.version-id }}
      version-number:
        description: "Version number, Major.Minor.Patch.Build"
        value: ${{ jobs.package.outputs.version-number }}
      git-tag:
        description: "Provenance tag pushed for this version"
        value: ${{ jobs.package.outputs.git-tag }}

jobs:
  # ---------------------------------------------------------------------------
  # validate — the only job that consumes a scratch org.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate source in scratch org
    if: ${{ inputs.run-validate }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
      # Run as the runner's own UID, not root: the runner owns
      # /github/home and the file-command dir. See the container-user input.
      options: --user ${{ inputs.container-user }}
    permissions:
      contents: read
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Salesforce Dev Hub login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@v2
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: devhub
          set-default-dev-hub: "true"

      # Whether we create an org or borrow one is decided once, here, so the
      # create and delete steps cannot disagree. This is a step output rather
      # than `if: secrets.x != ''` because the `secrets` context is not
      # dependable in a step-level `if:` — a wrong answer here either leaks an
      # org or deletes someone else's.
      - name: Resolve scratch org source
        id: org-source
        shell: bash
        env:
          REUSE_AUTH_URL: ${{ secrets.scratch-org-auth-url }}
        run: |
          set -euo pipefail
          if [ -n "${REUSE_AUTH_URL:-}" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Reusing the scratch org supplied by the caller — none will be created or deleted."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse existing scratch org
        if: ${{ steps.org-source.outputs.reuse == 'true' }}
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@v2
        with:
          sfdx-auth-url: ${{ secrets.scratch-org-auth-url }}
          org-alias: release-check

      - name: Create scratch org
        if: ${{ steps.org-source.outputs.reuse != 'true' }}
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-scratch-create@v2
        with:
          definition-file: ${{ inputs.scratch-org-definition }}
          alias: release-check
          dev-hub-alias: devhub
          duration-days: "1"

      - name: Push source
        shell: bash
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          set -euo pipefail
          ARGS=(--target-org release-check --wait 60)
          # Word splitting is intended — source-dirs is a space-separated list.
          # shellcheck disable=SC2086
          for DIR in ${SOURCE_DIRS:-}; do
            [ -d "$DIR" ] || { echo "::error::source-dirs entry '$DIR' does not exist." >&2; exit 1; }
            ARGS+=(--source-dir "$DIR")
          done
          sf project deploy start "${ARGS[@]}"

      - name: Assign permission sets
        shell: bash
        env:
          SOURCE_DIRS: ${{ inputs.source-dirs }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Only look where we actually deployed, so unrelated package dirs do
          # not produce warnings for permission sets that were never pushed.
          # Word splitting is intended — source-dirs is a space-separated list.
          # shellcheck disable=SC2206
          SEARCH_ROOTS=(${SOURCE_DIRS:-.})
          FOUND=0
          for ROOT in "${SEARCH_ROOTS[@]}"; do
            for PS_FILE in "$ROOT"/**/permissionsets/*.permissionset-meta.xml; do
              FOUND=1
              PS_NAME=$(basename "$PS_FILE" .permissionset-meta.xml)
              sf org assign permset --name "$PS_NAME" --target-org release-check \
                || echo "::warning::Could not assign permission set $PS_NAME"
            done
          done
          [ "$FOUND" -eq 1 ] || echo "::notice::No permission sets found to assign."

      - name: Run Apex tests
        if: ${{ inputs.test-level != 'NoTestRun' }}
        shell: bash
        env:
          TEST_LEVEL: ${{ inputs.test-level }}
        run: |
          set -euo pipefail
          sf apex run test \
            --target-org release-check \
            --test-level "$TEST_LEVEL" \
            --wait 30 \
            --result-format human \
            --code-coverage | tee validate-tests.txt
          {
            echo '## Validate — Apex tests'
            echo '```'
            tail -n 40 validate-tests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-tests-${{ github.run_number }}
          path: validate-tests.txt
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

      # sf-org-scratch-create does not delete — composite actions cannot post-run.
      # Only ever delete an org this job created; a borrowed one is the caller's.
      - name: Delete scratch org
        if: ${{ always() && steps.org-source.outputs.reuse != 'true' }}
        shell: bash
        run: sf org delete scratch --target-org release-check --no-prompt || true

  # ---------------------------------------------------------------------------
  # package — needs the Dev Hub only. No scratch org.
  # ---------------------------------------------------------------------------
  package:
    name: Create package version
    needs: validate
    # `always()` so a skipped validate (run-validate: false) does not skip this.
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
      options: --user ${{ inputs.container-user }}
    permissions:
      contents: write
    outputs:
      version-id: ${{ steps.create.outputs.version-id }}
      version-number: ${{ steps.create.outputs.version-number }}
      package-version-id: ${{ steps.create.outputs.package-version-id }}
      request-id: ${{ steps.create.outputs.request-id }}
      git-tag: ${{ steps.tag.outputs.git-tag }}
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.checkout-submodules }}
          # The provenance tag step needs history to resolve refs.
          fetch-depth: 0

      - name: Salesforce Dev Hub login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@v2
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: devhub
          set-default-dev-hub: "true"

      - name: Create package version
        id: create
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-package-create@v2
        with:
          package: ${{ inputs.package }}
          dev-hub-alias: devhub
          wait-minutes: ${{ inputs.wait-minutes }}
          code-coverage: ${{ inputs.code-coverage }}
          skip-validation: ${{ inputs.skip-validation }}

      # Tagging is a git operation, so it lives here rather than inside
      # sf-package-create — see ADR 0002, decision 4. This job already holds
      # `contents: write`; the action itself now needs only `contents: read`.
      - name: Push provenance tag
        id: tag
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.create.outputs.package-name }}
          VERSION_NUMBER: ${{ steps.create.outputs.version-number }}
          VERSION_ID: ${{ steps.create.outputs.version-id }}
          PACKAGE_VERSION_ID: ${{ steps.create.outputs.package-version-id }}
          REQUEST_ID: ${{ steps.create.outputs.request-id }}
        run: |
          set -euo pipefail

          # Container jobs mount the workspace with mismatched ownership.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

          TAG="pkg/$PACKAGE_NAME/$VERSION_NUMBER"

          # A re-run against an existing version must not fail the build.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists — leaving it untouched."
            echo "git-tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$(git config --get user.email || true)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          # Provenance git -> Salesforce, readable offline and in the GitHub UI.
          # Package2Version.Tag carries the SHA for the reverse direction.
          git tag -a "$TAG" "$GITHUB_SHA" -F - <<EOF
          $PACKAGE_NAME $VERSION_NUMBER

          subscriber-id:   $VERSION_ID
          package-version: $PACKAGE_VERSION_ID
          request-id:      $REQUEST_ID
          commit:          $GITHUB_SHA
          branch:          ${GITHUB_REF_NAME:-}
          dev-hub:         devhub
          run:             ${GITHUB_SERVER_URL:-}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}
          created:         $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git push origin "refs/tags/$TAG"
          echo "git-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed $TAG at $GITHUB_SHA"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-create-evidence-${{ github.run_number }}
          path: evidence/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # release — manifest artifact and GitHub Release. No Salesforce CLI, no container.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: package
    # `always()` for the same reason `package` needs it: a skip propagates
    # transitively. With run-validate: false, `validate` skips, and without
    # always() this job skips too even though `package` succeeded — publishing
    # nothing while the run still reports green.
    if: ${{ always() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Build release manifest
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          VERSION_ID: ${{ needs.package.outputs.version-id }}
          VERSION_NUMBER: ${{ needs.package.outputs.version-number }}
          PACKAGE_VERSION_ID: ${{ needs.package.outputs.package-version-id }}
          REQUEST_ID: ${{ needs.package.outputs.request-id }}
          GIT_TAG: ${{ needs.package.outputs.git-tag }}
          VALIDATED: ${{ inputs.skip-validation == false }}
        run: |
          set -euo pipefail
          node <<'NODE' > release-manifest.json
          const env = process.env;
          console.log(JSON.stringify({
            schemaVersion: 1,
            package: env.PACKAGE_NAME || null,
            versionNumber: env.VERSION_NUMBER,
            subscriberPackageVersionId: env.VERSION_ID,
            package2VersionId: env.PACKAGE_VERSION_ID,
            createRequestId: env.REQUEST_ID,
            gitTag: env.GIT_TAG || null,
            commit: env.GITHUB_SHA,
            salesforceValidated: env.VALIDATED === 'true',
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            createdAt: new Date().toISOString(),
          }, null, 2));
          NODE
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: package-release-${{ github.run_number }}
          path: release-manifest.json
          retention-days: ${{ inputs.retention-days }}

      - name: Create GitHub Release
        if: ${{ inputs.create-github-release && needs.package.outputs.git-tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.package.outputs.git-tag }}
          VERSION_ID: ${{ needs.package.outputs.version-id }}
          VERSION_NUMBER: ${{ needs.package.outputs.version-number }}
          PACKAGE_NAME: ${{ inputs.package }}
          SKIP_VALIDATION: ${{ inputs.skip-validation }}
        run: |
          set -euo pipefail

          VALIDATION_NOTE="Built with Salesforce validation."
          if [ "$SKIP_VALIDATION" = "true" ]; then
            VALIDATION_NOTE="⚠️ Built with \`--skip-validation\` — Salesforce did not validate this version."
          fi

          cat > release-notes.md <<EOF
          ## ${PACKAGE_NAME:-package} $VERSION_NUMBER

          | | |
          |---|---|
          | Version Id | \`$VERSION_ID\` |
          | Commit | \`$GITHUB_SHA\` |

          $VALIDATION_NOTE

          ### Install

          2GP dependencies are **not** transitive — install any dependencies first, in order.

          \`\`\`bash
          sf package install --package $VERSION_ID \\
            --target-org <alias> --wait 20 --publish-wait 20 --no-prompt
          \`\`\`

          [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          if gh release view "$GIT_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $GIT_TAG already exists — leaving it untouched."
          else
            gh release create "$GIT_TAG" \
              --title "${PACKAGE_NAME:-package} $VERSION_NUMBER" \
              --notes-file release-notes.md \
              release-manifest.json
            echo "::notice::Published release $GIT_TAG"
          fi
