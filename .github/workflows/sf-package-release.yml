# Salesforce 2GP package release (reusable)
#
# validate -> package -> release. Exactly ONE scratch org, used by `validate`;
# `package` needs only the Dev Hub and `release` needs no Salesforce at all.
#
# Job order is driven by cost. Scratch orgs are capped per Dev Hub (both
# concurrently and per day) and validated package creates are capped at 6/day,
# so validation runs first: a tree that does not compile costs zero creates.
#
# Callers own the cleanup contract for the scratch org — see sf-scratch-org.

name: Salesforce Package Release (Reusable)

on:
  workflow_call:
    inputs:
      package:
        description: "Package name or alias from sfdx-project.json. Defaults to the single or default: true entry."
        required: false
        default: ""
        type: string
      container-image:
        description: "Docker image the Salesforce jobs run in"
        required: false
        default: "gforceinnovation/sf-ci:latest"
        type: string
      checkout-submodules:
        description: "Passed to actions/checkout submodules (false, true, recursive)"
        required: false
        default: "recursive"
        type: string
      scratch-org-definition:
        description: "Scratch org definition file used by the validate job"
        required: false
        default: "config/project-scratch-def.json"
        type: string
      run-validate:
        description: "Run the scratch-org validation job. Set false to skip it when scratch org capacity is exhausted."
        required: false
        default: true
        type: boolean
      test-level:
        description: "Apex test level for the validate job (NoTestRun, RunLocalTests, RunAllTestsInOrg)"
        required: false
        default: "RunLocalTests"
        type: string
      code-coverage:
        description: "Calculate code coverage during the package build. Set false for packages with no Apex tests."
        required: false
        default: false
        type: boolean
      skip-validation:
        description: "Build with --skip-validation, drawing on the 500/day limit instead of the 6/day one."
        required: false
        default: false
        type: boolean
      wait-minutes:
        description: "Hard ceiling on how long to wait for the package build"
        required: false
        default: "60"
        type: string
      create-github-release:
        description: "Cut a GitHub Release on the provenance tag"
        required: false
        default: true
        type: boolean
      retention-days:
        description: "Artifact retention"
        required: false
        default: 90
        type: number
    secrets:
      sfdx-auth-url:
        description: "SFDX auth URL of the Dev Hub"
        required: true
    outputs:
      version-id:
        description: "SubscriberPackageVersionId (04t) — the id you install"
        value: ${{ jobs.package.outputs.version-id }}
      version-number:
        description: "Version number, Major.Minor.Patch.Build"
        value: ${{ jobs.package.outputs.version-number }}
      git-tag:
        description: "Provenance tag pushed for this version"
        value: ${{ jobs.package.outputs.git-tag }}

jobs:
  # ---------------------------------------------------------------------------
  # validate — the only job that consumes a scratch org.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate source in scratch org
    if: ${{ inputs.run-validate }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
      # Runner file-command dirs are owned by the host runner user; non-root
      # container users hit EACCES without this.
      options: --user root
    permissions:
      contents: read
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Salesforce Dev Hub login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@refactor/simplify-sf-package-create
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: devhub
          set-default-dev-hub: "true"

      - name: Create scratch org
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-scratch-org@refactor/simplify-sf-package-create
        with:
          definition-file: ${{ inputs.scratch-org-definition }}
          alias: release-check
          dev-hub-alias: devhub
          duration-days: "1"

      - name: Push source
        shell: bash
        run: sf project deploy start --target-org release-check --wait 60

      - name: Assign permission sets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          FOUND=0
          for PS_FILE in **/permissionsets/*.permissionset-meta.xml; do
            FOUND=1
            PS_NAME=$(basename "$PS_FILE" .permissionset-meta.xml)
            sf org assign permset --name "$PS_NAME" --target-org release-check \
              || echo "::warning::Could not assign permission set $PS_NAME"
          done
          [ "$FOUND" -eq 1 ] || echo "::notice::No permission sets found to assign."

      - name: Run Apex tests
        if: ${{ inputs.test-level != 'NoTestRun' }}
        shell: bash
        env:
          TEST_LEVEL: ${{ inputs.test-level }}
        run: |
          set -euo pipefail
          sf apex run test \
            --target-org release-check \
            --test-level "$TEST_LEVEL" \
            --wait 30 \
            --result-format human \
            --code-coverage | tee validate-tests.txt
          {
            echo '## Validate — Apex tests'
            echo '```'
            tail -n 40 validate-tests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-tests-${{ github.run_number }}
          path: validate-tests.txt
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

      # sf-scratch-org does not delete — composite actions cannot post-run.
      - name: Delete scratch org
        if: always()
        shell: bash
        run: sf org delete scratch --target-org release-check --no-prompt || true

  # ---------------------------------------------------------------------------
  # package — needs the Dev Hub only. No scratch org.
  # ---------------------------------------------------------------------------
  package:
    name: Create package version
    needs: validate
    # `always()` so a skipped validate (run-validate: false) does not skip this.
    if: ${{ always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container-image }}
      options: --user root
    permissions:
      contents: write
    outputs:
      version-id: ${{ steps.create.outputs.version-id }}
      version-number: ${{ steps.create.outputs.version-number }}
      package-version-id: ${{ steps.create.outputs.package-version-id }}
      request-id: ${{ steps.create.outputs.request-id }}
      git-tag: ${{ steps.create.outputs.git-tag }}
    steps:
      - name: Check out files
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.checkout-submodules }}
          # The provenance tag step needs history to resolve refs.
          fetch-depth: 0

      - name: Salesforce Dev Hub login
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-org-login@refactor/simplify-sf-package-create
        with:
          sfdx-auth-url: ${{ secrets.sfdx-auth-url }}
          org-alias: devhub
          set-default-dev-hub: "true"

      - name: Create package version
        id: create
        uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/sf-package-create@refactor/simplify-sf-package-create
        with:
          package: ${{ inputs.package }}
          dev-hub-alias: devhub
          wait-minutes: ${{ inputs.wait-minutes }}
          code-coverage: ${{ inputs.code-coverage }}
          skip-validation: ${{ inputs.skip-validation }}
          push-tag: "true"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-create-evidence-${{ github.run_number }}
          path: evidence/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # release — manifest artifact and GitHub Release. No Salesforce CLI, no container.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: package
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Build release manifest
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          VERSION_ID: ${{ needs.package.outputs.version-id }}
          VERSION_NUMBER: ${{ needs.package.outputs.version-number }}
          PACKAGE_VERSION_ID: ${{ needs.package.outputs.package-version-id }}
          REQUEST_ID: ${{ needs.package.outputs.request-id }}
          GIT_TAG: ${{ needs.package.outputs.git-tag }}
          VALIDATED: ${{ inputs.skip-validation == false }}
        run: |
          set -euo pipefail
          node <<'NODE' > release-manifest.json
          const env = process.env;
          console.log(JSON.stringify({
            schemaVersion: 1,
            package: env.PACKAGE_NAME || null,
            versionNumber: env.VERSION_NUMBER,
            subscriberPackageVersionId: env.VERSION_ID,
            package2VersionId: env.PACKAGE_VERSION_ID,
            createRequestId: env.REQUEST_ID,
            gitTag: env.GIT_TAG || null,
            commit: env.GITHUB_SHA,
            salesforceValidated: env.VALIDATED === 'true',
            runUrl: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            createdAt: new Date().toISOString(),
          }, null, 2));
          NODE
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: package-release-${{ github.run_number }}
          path: release-manifest.json
          retention-days: ${{ inputs.retention-days }}

      - name: Create GitHub Release
        if: ${{ inputs.create-github-release && needs.package.outputs.git-tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.package.outputs.git-tag }}
          VERSION_ID: ${{ needs.package.outputs.version-id }}
          VERSION_NUMBER: ${{ needs.package.outputs.version-number }}
          PACKAGE_NAME: ${{ inputs.package }}
          SKIP_VALIDATION: ${{ inputs.skip-validation }}
        run: |
          set -euo pipefail

          VALIDATION_NOTE="Built with Salesforce validation."
          if [ "$SKIP_VALIDATION" = "true" ]; then
            VALIDATION_NOTE="⚠️ Built with \`--skip-validation\` — Salesforce did not validate this version."
          fi

          cat > release-notes.md <<EOF
          ## ${PACKAGE_NAME:-package} $VERSION_NUMBER

          | | |
          |---|---|
          | Version Id | \`$VERSION_ID\` |
          | Commit | \`$GITHUB_SHA\` |

          $VALIDATION_NOTE

          ### Install

          2GP dependencies are **not** transitive — install any dependencies first, in order.

          \`\`\`bash
          sf package install --package $VERSION_ID \\
            --target-org <alias> --wait 20 --publish-wait 20 --no-prompt
          \`\`\`

          [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          if gh release view "$GIT_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $GIT_TAG already exists — leaving it untouched."
          else
            gh release create "$GIT_TAG" \
              --title "${PACKAGE_NAME:-package} $VERSION_NUMBER" \
              --notes-file release-notes.md \
              release-manifest.json
            echo "::notice::Published release $GIT_TAG"
          fi
