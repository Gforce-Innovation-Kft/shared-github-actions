---
# ==============================================================================
# Smoke test for sf-org-login.
#
# Composite actions have no unit-test harness, so the gate is a real run against
# a real org. This asserts the action's OUTPUT CONTRACT, which is what every
# downstream action depends on — not merely that the CLI exited zero.
#
# Three properties worth a test each:
#   1. github-env credentials authenticate and the outputs are populated
#   2. access-token is a real token, not the "[REDACTED]" placeholder that
#      `sf org display` has returned since CLI 2.145
#   3. no credential file survives the job
#
# Costs no scratch org and no package version — it only logs in.
# ==============================================================================
name: ci-sf-org-login-smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/sf-org-login/**"
      - ".github/workflows/ci-sf-org-login-smoke.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-env-source:
    name: credential-source github-env
    runs-on: ubuntu-latest
    environment: integration
    container:
      image: gforceinnovation/sf-ci:1.7.0
      options: --user 1001
    permissions:
      contents: read
    steps:
      - name: Check out the action under test
        uses: actions/checkout@v4

      - name: Log in with environment credentials
        id: login
        uses: ./.github/actions/sf-org-login
        with:
          auth-method: jwt
          credential-source: github-env
          jwt-key-b64: ${{ secrets.SF_JWT_KEY_B64 }}
          client-id: ${{ vars.SF_CLIENT_ID }}
          username: ${{ vars.SF_USERNAME }}
          instance-url: ${{ vars.SF_INSTANCE_URL }}
          org-alias: smoke
          fetch-access-token: "true"

      - name: Assert the identity outputs are populated
        env:
          ORG_ID: ${{ steps.login.outputs.org-id }}
          USERNAME: ${{ steps.login.outputs.username }}
          INSTANCE_URL: ${{ steps.login.outputs.instance-url }}
        run: |
          set -euo pipefail

          [ -n "$ORG_ID" ]       || { echo "::error::org-id output was empty"; exit 1; }
          [ -n "$USERNAME" ]     || { echo "::error::username output was empty"; exit 1; }
          [ -n "$INSTANCE_URL" ] || { echo "::error::instance-url output was empty"; exit 1; }

          case "$ORG_ID" in
            00D*) ;;
            *) echo "::error::org-id '$ORG_ID' is not a Salesforce org id"; exit 1 ;;
          esac

          # instance-url must be the org's My Domain, NOT the login url we
          # passed in. Returning the login url would mean downstream API calls
          # go to the wrong host.
          case "$INSTANCE_URL" in
            *login.salesforce.com*|*test.salesforce.com*)
              echo "::error::instance-url is the login url, not the org's My Domain"; exit 1 ;;
          esac

          echo "✅ identity outputs valid — $USERNAME ($ORG_ID)"

      # The regression that motivated this action's rewrite. Since CLI 2.145
      # `sf org display` returns a ~54-char "[REDACTED]" string for accessToken.
      # It LOOKS like a token, so a consumer gets an opaque 401 rather than an
      # obvious failure. A real token is ~112 chars and starts with the org id.
      - name: Assert access-token is real, not a redaction placeholder
        env:
          ACCESS_TOKEN: ${{ steps.login.outputs.access-token }}
          ORG_ID: ${{ steps.login.outputs.org-id }}
        run: |
          set -euo pipefail

          [ -n "$ACCESS_TOKEN" ] || { echo "::error::access-token was empty despite fetch-access-token: true"; exit 1; }

          case "$ACCESS_TOKEN" in
            *REDACTED*|*hidden*)
              echo "::error::access-token is a redaction placeholder, not a token. The action is reading it from 'sf org display' again instead of 'sf org auth show-access-token'."
              exit 1
              ;;
          esac

          # A session id is <15-char org id prefix>!<signature>. Length alone is
          # a weak check, so assert the structure too.
          case "$ACCESS_TOKEN" in
            "${ORG_ID:0:15}"'!'*) ;;
            *) echo "::error::access-token is not shaped like a Salesforce session id"; exit 1 ;;
          esac

          echo "✅ access-token is a real session id (masked)"

      - name: Assert no credential file survived
        if: always()
        run: |
          set -euo pipefail
          FOUND=0
          for f in jwt-key.txt sfdx-auth-url.txt org-info.json token.json; do
            if [ -f "$f" ]; then
              echo "::error::$f was left on disk"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] || exit 1
          echo "✅ no credential files left behind"

  # A wrong instance-url is the most common JWT failure in CI. The action should
  # name that specific mistake up front rather than let it surface 60 seconds
  # later as a generic server-side JWT error.
  rejects-my-domain-url:
    name: rejects a My Domain instance-url
    runs-on: ubuntu-latest
    container:
      image: gforceinnovation/sf-ci:1.7.0
      options: --user 1001
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Attempt a login with a My Domain url
        id: bad
        continue-on-error: true
        uses: ./.github/actions/sf-org-login
        with:
          auth-method: jwt
          credential-source: github-env
          jwt-key-b64: bm90LWEta2V5
          client-id: not-a-client-id
          username: someone@example.com
          instance-url: https://orgfarm-e65e3ad1e9-dev-ed.develop.my.salesforce.com
          org-alias: should-not-exist

      - name: Assert it was rejected at validation
        run: |
          set -euo pipefail
          [ "${{ steps.bad.outcome }}" = "failure" ] \
            || { echo "::error::a My Domain instance-url was accepted"; exit 1; }
          echo "✅ My Domain url rejected before any network call"
