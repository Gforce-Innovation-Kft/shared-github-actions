name: Release

# Pushing a semver tag (vX.Y.Z) creates the GitHub Release and moves the
# floating major tag (vX) to the same commit, so callers can pin either
# `@vX` (moving) or `@vX.Y.Z` (immutable). See CONTRIBUTING.md for the
# release procedure.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Publish the Release & move the major tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

      - name: Move floating major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `$TAG^{}` peels the annotated tag to the commit. Without it git tags a
          # tag — a nested tag — and `refs/tags/$MAJOR` then points at the v-tag
          # object rather than the commit. Actions still resolves it by peeling, so
          # this stays invisible until something reads the ref directly.
          git tag -fa "$MAJOR" -m "Point $MAJOR at $TAG" "$TAG^{}"
          git push origin "$MAJOR" --force
