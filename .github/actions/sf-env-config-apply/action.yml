name: "Salesforce Environment Config Apply"
description: "Render secret-bearing Custom Metadata from templates and deploy it, after the artifact"
author: "GForce Innovation"

# ==============================================================================
# Puts secrets in the org without ever putting them in the artifact.
#
# The deployment artifact is uploaded and retained, so anything baked into it at
# convert time is retained too. Credentials therefore arrive by a second, much
# smaller deployment that happens after the artifact lands.
#
# Custom Metadata records are metadata, not data — they cannot be upserted
# through the Data API, they have to be deployed. So this renders
# *.md-meta.xml.tpl with values from the environment, deploys only those files,
# and shreds the rendered copies on every exit path.
#
# Runs after sf-artifact-deploy. Requires a prior sf-org-login.
# Caller permissions: none.
# ==============================================================================

inputs:
  template-dir:
    description: |
      Directory holding customMetadata/*.md-meta.xml.tpl. Normally
      <artifact>/secret-templates, because the deploy job has no checkout and
      the templates travel inside the artifact.
    required: true
  required:
    description: |
      Whether finding no templates is an error.

      Default true, and deliberately so. The first real deployment of this
      pipeline pointed the action at a path that did not exist in the deploy
      job, and it reported "nothing to apply" and passed — the credential
      silently never landed, and only a query against the org revealed it.
      "I found nothing to do" and "I did what was asked" must not look alike.

      Set false only for a repo that genuinely has no secret-bearing metadata.
    required: false
    default: "true"
  org-alias:
    description: "Alias of an already-authenticated org"
    required: true
  api-version:
    description: "Metadata API version for the generated package.xml"
    required: false
    default: "65.0"

outputs:
  records-applied:
    description: "Number of custom metadata records deployed"
    value: ${{ steps.apply.outputs.records-applied }}

runs:
  using: "composite"
  steps:
    - name: Render and deploy
      id: apply
      shell: bash
      env:
        TEMPLATE_DIR: ${{ inputs.template-dir }}
        ORG_ALIAS: ${{ inputs.org-alias }}
        API_VERSION: ${{ inputs.api-version }}
        REQUIRED: ${{ inputs.required }}
      run: |
        set -euo pipefail
        umask 077

        # A missing directory and an empty one are the same failure — the
        # credential does not reach the org — so there is one gate for both,
        # after the loop, rather than a near-duplicate of it here.

        # Rendered files hold real credentials in plaintext for the duration of
        # the deploy. The trap fires on success, failure and interrupt alike,
        # and reports if it somehow could not clean up.
        RENDER_DIR=$(mktemp -d)
        trap 'rm -rf "$RENDER_DIR"; [ ! -d "$RENDER_DIR" ] || echo "::warning::rendered credentials survived at $RENDER_DIR"' EXIT
        mkdir -p "$RENDER_DIR/customMetadata"

        # Load non-secret per-environment values bundled with the artifact.
        # The deploy job has no checkout, so config/environments/<env>.json is
        # unreachable from source — sf-artifact-build ships it in the artifact.
        if [ -f "$TEMPLATE_DIR/env-config.json" ]; then
          while IFS= read -r LINE; do
            export "${LINE?}"
          done < <(node -e '
            const cfg = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const [k, v] of Object.entries(cfg)) console.log(`${k}=${v}`);
          ' "$TEMPLATE_DIR/env-config.json")
          echo "Loaded environment config bundled with the artifact."
        fi

        COUNT=0
        MEMBERS=""
        for TPL in "$TEMPLATE_DIR"/customMetadata/*.md-meta.xml.tpl; do
          [ -e "$TPL" ] || continue
          BASE=$(basename "$TPL" .tpl)
          TARGET="$RENDER_DIR/customMetadata/$BASE"

          # Check BEFORE rendering. envsubst substitutes an EMPTY STRING for an
          # unset variable — it does not leave the placeholder behind — so a
          # post-render scan for "${" cannot see the failure at all. That is
          # how a record once deployed with the label "Github Gforce App ()".
          MISSING=""
          for VAR in $(grep -o '\${[A-Za-z_][A-Za-z0-9_]*}' "$TPL" | tr -d '${}' | sort -u); do
            if [ -z "${!VAR:-}" ]; then
              MISSING="$MISSING $VAR"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::$BASE needs value(s) the environment does not provide:$MISSING" >&2
            echo "  Secrets come from GitHub Environment secrets wired in the caller workflow." >&2
            echo "  Non-secret values come from config/environments/<env>.json, bundled into the artifact." >&2
            echo "  Rendering anyway would substitute an empty string and deploy a blank field." >&2
            exit 1
          fi

          envsubst < "$TPL" > "$TARGET"

          # Belt and braces: a literal ${VAR} surviving means envsubst skipped
          # a form it does not handle.
          if grep -q '\${' "$TARGET"; then
            LEFT=$(grep -o '\${[A-Za-z_][A-Za-z0-9_]*}' "$TARGET" | sort -u | tr '\n' ' ')
            echo "::error::Placeholder(s) survived rendering in $BASE: $LEFT" >&2
            exit 1
          fi

          MEMBERS="${MEMBERS}        <members>${BASE%.md-meta.xml}</members>"$'\n'
          COUNT=$((COUNT + 1))
        done

        # The real invariant: the build bundled N templates, so the deploy must
        # apply N. sf-artifact-build records that count in deployment.json, which
        # turns "the credential silently never landed" from a no-op that reports
        # success into a mismatch this action can name. Falls back to `required`
        # when there is no manifest to compare against.
        MANIFEST="$TEMPLATE_DIR/../deployment.json"
        EXPECTED=""
        [ -f "$MANIFEST" ] && EXPECTED=$(node -pe "
          JSON.parse(require('fs').readFileSync('$MANIFEST','utf8')).secretTemplateCount ?? ''" 2>/dev/null || true)

        if [ -n "$EXPECTED" ] && [ "$COUNT" != "$EXPECTED" ]; then
          echo "::error::The artifact bundled $EXPECTED secret template(s) but $COUNT were found at '$TEMPLATE_DIR/customMetadata'. The credential would not reach the org." >&2
          ls -la "$TEMPLATE_DIR" >&2 2>&1 || echo "  ('$TEMPLATE_DIR' does not exist)" >&2
          exit 1
        fi

        if [ "$COUNT" -eq 0 ]; then
          if [ -z "$EXPECTED" ] && [ "$REQUIRED" = "true" ]; then
            echo "::error::No *.md-meta.xml.tpl found under '$TEMPLATE_DIR/customMetadata', and no artifact manifest to check against. Credentials would silently never reach the org — if the deploy job has no checkout, the templates must travel inside the artifact (set secret-template-dir on sf-artifact-build)." >&2
            ls -la "$TEMPLATE_DIR" >&2 2>&1 || echo "  ('$TEMPLATE_DIR' does not exist)" >&2
            exit 1
          fi
          echo "No secret templates to apply."
          echo "records-applied=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        cat > "$RENDER_DIR/package.xml" <<XML
        <?xml version="1.0" encoding="UTF-8"?>
        <Package xmlns="http://soap.sforce.com/2006/04/metadata">
            <types>
        ${MEMBERS}        <name>CustomMetadata</name>
            </types>
            <version>${API_VERSION}</version>
        </Package>
        XML

        # NoTestRun: this deploys configuration records only, and the artifact
        # deployment immediately before already ran the test policy.
        if ! sf project deploy start \
              --metadata-dir "$RENDER_DIR" \
              --target-org "$ORG_ALIAS" \
              --test-level NoTestRun \
              --wait 10 \
              --json > "$RENDER_DIR/result.json"; then
          echo "::error::Failed to apply environment config to $ORG_ALIAS." >&2
          # Both levels, same as sf-artifact-deploy. A CLI-level rejection
          # arrives as a top-level name/message with no componentFailures at
          # all, so reporting only componentFailures turns a clear error into
          # "(no detail)" — and this is the step where that hurts most, because
          # the rendered files hold credentials and cannot be echoed.
          node -e '
            const fs = require("fs");
            let r;
            try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch { console.error("  (could not parse the deploy result)"); process.exit(0); }
            if (r.name || r.message) console.error(`  ${r.name ?? "Error"}: ${r.message ?? ""}`);
            for (const a of r.actions ?? []) console.error(`  hint: ${a}`);
            const cf = r.result?.details?.componentFailures ?? [];
            for (const f of (Array.isArray(cf) ? cf : [cf])) {
              console.error(`  ${f.componentType ?? "?"} ${f.fullName ?? "?"}: ${f.problem ?? "?"}`);
            }
          ' "$RENDER_DIR/result.json" >&2
          exit 1
        fi

        echo "records-applied=$COUNT" >> "$GITHUB_OUTPUT"
        echo "✅ applied $COUNT custom metadata record(s) to $ORG_ALIAS"
