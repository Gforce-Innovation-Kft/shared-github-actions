name: "Salesforce Source Delta"
description: "Generate a delta package.xml between two git refs using sfdx-git-delta"
author: "GForce Innovation"

inputs:
  from-ref:
    description: "Base git ref/SHA for the delta (e.g. the PR base or previous deploy commit)"
    required: true
  to-ref:
    description: "Head git ref/SHA for the delta"
    required: false
    default: "HEAD"
  output-dir:
    description: "Directory the delta package is written to"
    required: false
    default: "delta"
  source-dir:
    description: "Source directory sfdx-git-delta scans"
    required: false
    default: "force-app"
  generate-delta:
    description: "Also copy the changed source files into the output dir (audit-friendly)"
    required: false
    default: "false"

outputs:
  package-path:
    description: "Path to the generated delta package.xml"
    value: ${{ steps.delta.outputs.package-path }}
  has-changes:
    description: "true when the delta contains at least one deployable component"
    value: ${{ steps.delta.outputs.has-changes }}
  component-count:
    description: "Total number of components in the delta package"
    value: ${{ steps.delta.outputs.component-count }}

runs:
  using: "composite"
  steps:
    # No credentials are handled by this action, so no if: always() cleanup step.
    - name: Verify git refs
      shell: bash
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
      run: |
        set -euo pipefail

        # Container jobs mount the workspace with mismatched ownership
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

        for REF in "$FROM_REF" "$TO_REF"; do
          if ! git rev-parse --verify --quiet "${REF}^{commit}" > /dev/null; then
            echo "::error::Git ref '$REF' cannot be resolved. Check out with 'fetch-depth: 0' so both delta refs exist locally." >&2
            exit 1
          fi
        done

    - name: Ensure sfdx-git-delta plugin
      shell: bash
      run: |
        set -euo pipefail
        if ! sf plugins inspect sfdx-git-delta > /dev/null 2>&1; then
          # Preinstalled in gforceinnovation/sf-ci — this fallback costs ~30s elsewhere
          echo "sfdx-git-delta not found — installing"
          echo y | sf plugins install sfdx-git-delta
        fi

    - name: Generate delta package
      id: delta
      shell: bash
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        GENERATE_DELTA: ${{ inputs.generate-delta }}
      run: |
        set -euo pipefail

        mkdir -p "$OUTPUT_DIR"

        EXTRA_ARGS=()
        if [ "$GENERATE_DELTA" = "true" ]; then
          EXTRA_ARGS+=(--generate-delta)
        fi
        sf sgd source delta \
          --from "$FROM_REF" \
          --to "$TO_REF" \
          --output-dir "$OUTPUT_DIR" \
          --source-dir "$SOURCE_DIR" \
          "${EXTRA_ARGS[@]}"

        PACKAGE_XML="$OUTPUT_DIR/package/package.xml"
        if [ ! -f "$PACKAGE_XML" ]; then
          echo "::error::sfdx-git-delta did not produce $PACKAGE_XML" >&2
          exit 1
        fi

        COMPONENT_COUNT=$(grep -c "<members>" "$PACKAGE_XML" || true)
        TYPES_COUNT=$(grep -c "<types>" "$PACKAGE_XML" || true)
        if [ "$TYPES_COUNT" -gt 0 ]; then
          HAS_CHANGES=true
        else
          HAS_CHANGES=false
        fi

        {
          echo "package-path=$PACKAGE_XML"
          echo "has-changes=$HAS_CHANGES"
          echo "component-count=$COMPONENT_COUNT"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### Delta package (\`$FROM_REF\` → \`$TO_REF\`)"
          echo ""
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "$COMPONENT_COUNT component(s):"
            echo ""
            echo "| Type | Member |"
            echo "|------|--------|"
            awk '
              /<types>/  { n = 0; delete m }
              /<members>/ { line = $0; gsub(/.*<members>|<\/members>.*/, "", line); m[n++] = line }
              /<name>/    { line = $0; gsub(/.*<name>|<\/name>.*/, "", line); t = line }
              /<\/types>/ { for (i = 0; i < n; i++) printf "| %s | %s |\n", t, m[i] }
            ' "$PACKAGE_XML"
          else
            echo "_No deployable metadata changes._"
          fi
        } > "$OUTPUT_DIR/components.md"

        cat "$OUTPUT_DIR/components.md" >> "$GITHUB_STEP_SUMMARY"
