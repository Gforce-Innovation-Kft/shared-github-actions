name: 'GitHub Branch Sync'
description: 'Synchronize one branch into another via fast-forward, merge, or a sync pull request on conflict.'
author: 'GForce Innovation'

# Required caller permissions:
#   contents: write        # fast-forward / merge the target branch
#   pull-requests: write   # open a sync PR when the merge conflicts

inputs:
  source-branch:
    description: 'Branch to take changes from.'
    required: true
  target-branch:
    description: 'Branch to update with the source branch.'
    required: true
  strategy:
    description: 'How to sync: "auto" (fast-forward, else merge, else open a PR), "fast-forward", or "merge".'
    required: false
    default: 'auto'
  dry-run:
    description: 'When true, report the planned action without changing anything.'
    required: false
    default: 'true'
  github-token:
    description: 'Token used to call the GitHub API.'
    required: true
    default: ${{ github.token }}

outputs:
  synced:
    description: 'true when the target branch was updated (fast-forward or merge).'
  action:
    description: 'What happened: none | fast-forward | merge | pull-request.'
  result-sha:
    description: 'Resulting commit SHA on the target branch (fast-forward / merge).'
  pull-request-number:
    description: 'Number of the sync pull request opened on merge conflict (if any).'
  pull-request-url:
    description: 'URL of the sync pull request opened on merge conflict (if any).'
  ahead-by:
    description: 'Commits the source branch is ahead of the target.'
  behind-by:
    description: 'Commits the source branch is behind the target.'
  dry-run:
    description: 'Echoes whether this run was a dry run.'
  reason:
    description: 'Short machine-readable reason for the outcome.'

runs:
  using: 'node20'
  main: 'dist/index.js'
