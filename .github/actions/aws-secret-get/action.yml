name: "AWS Secret Get"
description: "Fetches a secret from AWS Secrets Manager and returns its value"
author: "GForce Innovation"

# Required caller permissions (for OIDC role assumption):
#   id-token: write
#   contents: read
#
# Outputs: none. The secret JSON is parsed (parse-json-secrets: true) and each
# field is exported as an environment variable for later steps in the same job.
# Reference fields as ${{ env.FIELD_NAME }} (e.g. ${{ env.JWT_KEY_B64 }}), not as
# step outputs.

inputs:
  aws-region:
    description: "AWS region where the secret is stored"
    required: false
    default: "eu-central-1"
  secret-name:
    description: "Name of the secret in AWS Secrets Manager"
    required: true
  aws-role-arn:
    description: "ARN of the AWS IAM role to assume (for OIDC authentication)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-${{ github.run_id }}

    - name: Retrieve Secret from AWS Secrets Manager
      uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
      with:
        secret-ids: |
          ,${{ inputs.secret-name }}
        parse-json-secrets: true
