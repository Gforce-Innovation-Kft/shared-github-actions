name: "Salesforce JWT Login"
description: "Authenticate to Salesforce using JWT stored in AWS Secrets Manager"
author: "GForce Innovation"

inputs:
  aws-region:
    description: "AWS region where the secret is stored"
    required: false
    default: "eu-central-1"
  secret-name:
    description: "Name of the secret in AWS Secrets Manager containing Salesforce credentials"
    required: false
    default: "salesforce/gabor-devhub"
  aws-role-arn:
    description: "ARN of the AWS IAM role to assume (for OIDC authentication)"
    required: true
  org-alias:
    description: "Alias for the Salesforce org"
    required: false
    default: "devhub"
  set-default-dev-hub:
    description: "Set this org as the default Dev Hub"
    required: false
    default: "true"

outputs:
  org-id:
    description: "The Salesforce org ID"
    value: ${{ steps.display-org.outputs.org-id }}
  username:
    description: "The authenticated username"
    value: ${{ steps.display-org.outputs.username }}

runs:
  using: "composite"
  steps:
    # Own-repo ref: composite actions cannot use relative paths, so this
    # resolves at runtime. Kept on @main — callers pinning sf-jwt-login to an
    # old tag still get the current get-aws-secret (known version-skew caveat).
    - name: Get Salesforce credentials from AWS Secrets Manager
      uses: Gforce-Innovation-Kft/shared-github-actions/.github/actions/get-aws-secret@main
      with:
        aws-region: ${{ inputs.aws-region }}
        secret-name: ${{ inputs.secret-name }}
        aws-role-arn: ${{ inputs.aws-role-arn }}

    - name: Create JWT key file
      shell: bash
      run: |
        set -euo pipefail

        # Use the parsed env var JWT_KEY_B64
        if [ -n "${JWT_KEY_B64:-}" ]; then
          # Decode base64 into jwt-key.txt
          if command -v openssl >/dev/null 2>&1; then
            echo "$JWT_KEY_B64" | openssl base64 -d -A > jwt-key.txt
          else
            echo "$JWT_KEY_B64" | base64 --decode > jwt-key.txt
          fi
        else
          echo "No JWT_KEY_B64 found in secret" >&2
          exit 1
        fi

        chmod 600 jwt-key.txt

    - name: Salesforce JWT Login
      shell: bash
      env:
        ORG_ALIAS: ${{ inputs.org-alias }}
        SET_DEFAULT_DEV_HUB: ${{ inputs.set-default-dev-hub }}
      run: |
        EXTRA_ARGS=()
        if [ "$SET_DEFAULT_DEV_HUB" = "true" ]; then
          EXTRA_ARGS+=(--set-default-dev-hub)
        fi
        sf org login jwt \
          --username "$USERNAME" \
          --jwt-key-file jwt-key.txt \
          --client-id "$CLIENT_ID" \
          --instance-url "$INSTANCE_URL" \
          --alias "$ORG_ALIAS" \
          "${EXTRA_ARGS[@]}"

    - name: Display org info
      id: display-org
      shell: bash
      env:
        ORG_ALIAS: ${{ inputs.org-alias }}
      run: |
        sf org display --target-org "$ORG_ALIAS" --json > org-info.json

        ORG_ID=$(jq -r '.result.id' org-info.json)
        USERNAME=$(jq -r '.result.username' org-info.json)

        echo "org-id=$ORG_ID" >> $GITHUB_OUTPUT
        echo "username=$USERNAME" >> $GITHUB_OUTPUT

        echo "✅ Successfully authenticated to Salesforce"
        echo "   Org ID: $ORG_ID"
        echo "   Username: $USERNAME"
        echo "   Alias: $ORG_ALIAS"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -f jwt-key.txt org-info.json
